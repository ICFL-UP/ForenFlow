[[local|localrc]]

# Host networking
HOST_IP=192.168.100.1
PUBLIC_INTERFACE=enp0s8
OVS_PHYSICAL_BRIDGE=br-ex
PHYSICAL_NETWORK=public

FLOATING_RANGE=192.168.100.0/24
FIXED_RANGE=10.0.0.0/24
NETWORK_GATEWAY=10.0.0.1

# Neutron with ML2 + OVS
Q_PLUGIN=ml2
Q_ML2_TYPE_DRIVERS=flat,vlan,vxlan
Q_ML2_PLUGIN_MECHANISM_DRIVERS=openvswitch
Q_AGENT=openvswitch
Q_ML2_TENANT_NETWORK_TYPE=vxlan
TENANT_TUNNEL_RANGES=1:1000
ENABLE_TENANT_TUNNELS=True

# Enable legacy Neutron agents
disable_service n-net
enable_service q-svc
enable_service q-agt
enable_service q-dhcp
enable_service q-l3
enable_service q-meta
enable_service neutron

# Disable OVN (DevStack 2025.1 default)
disable_service ovn-controller
disable_service ovn-northd
disable_service ovn-controller-service
disable_service ovn-nb-db
disable_service ovn-sb-db

# Credentials
ADMIN_PASSWORD=secret
DATABASE_PASSWORD=secret
RABBIT_PASSWORD=secret
SERVICE_PASSWORD=secret

# Tap-as-a-Service
enable_plugin tap-as-a-service https://opendev.org/openstack/tap-as-a-service stable/2025.1
enable_service taas
enable_service taas-agent
Q_ML2_PLUGIN_EXT_DRIVERS=port_security,taas
NEUTRON_TAAS_DRIVER=ovs
NEUTRON_CORE_PLUGIN=ml2

# Logging
LOGFILE=/opt/stack/logs/stack.sh.log
LOG_COLOR=True
